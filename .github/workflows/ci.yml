name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install tshark (non-interactive)
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
          tshark -v | head -1

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Test (tshark differential required)
        run: npm test
        env:
          REQUIRE_TSHARK: '1'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chromium only: the suite drives a virtual clock rather than waiting on
      # real time, so a second engine would cost minutes and prove little.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` builds the site and serves it with `vite preview`.
      - run: npm run e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
